 {id:'fb',name:'FrenchBreaches',url:'https://frenchbreaches.com/feed.xml',cat:'Fuites de données',lang:'FR'},

 watch:store.get('cv_watch','Microsoft, Fortinet, Citrix, Cisco, Ivanti, VMware, Palo Alto, Veeam'),gh:store.get('cv_gh',null),rec:store.get('cv_rec',{}),ghf:store.get('cv_ghf',true),gerr:'',kerr:'',cerr:'',map:'',loading:false,last:store.get('cv_last',0),timer:1800};

S.fail={};S.base=store.get('cv_base','https://raw.githubusercontent.com/Woualy/kev-dashboard/data/');S.ent=store.get('cv_ent','');S.srv=null;S.zd=store.get('cv_zd',[]);S.pg=store.get('cv_pg','veille');S.zf=Object.assign({zero:false,wo:false,hi:false,grp:true},store.get('cv_zf',{}));S.zf.q='';S.zopen=new Set();S.cloud=store.get('cv_cl',null);S.ransom=store.get('cv_rs',null);S.wo=store.get('cv_wo',false);

  <p style="color:var(--m);font-size:13px;margin:0 0 8px">Saisis le nom de ton organisation, tes noms de domaine et tes principaux fournisseurs, séparés par des virgules ou des retours à la ligne. Toute fuite, revendication de rançongiciel ou dépêche qui les mentionne est signalée en rouge sur la page Veille. La liste reste dans ce navigateur (elle n’est pas envoyée au dépôt) ; la comparaison ignore les accents et les majuscules et ne retient que des mots entiers.</p>
  <textarea id="entt" rows="5" style="width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px;font:inherit" placeholder="Exemple : nom de la collectivité, mon-domaine.fr, nom d’un fournisseur">${esc(S.ent)}</textarea>
  <div class="foot"><span style="color:var(--m);font-size:12px">${ents().length} entité${ents().length>1?'s':''} · ${m.length} correspondance${m.length>1?'s':''} (30 j)</span><span><button data-a="entsave">Enregistrer</button> <button data-a="close">Fermer</button></span></div>`+
  (m.length?'<h2 style="margin-top:14px">Correspondances</h2>'+m.slice(0,25).map(x=>`<div class="fl"><div><span class="sv u">${x.t}</span> <a href="${esc(safeUrl(x.link))}" target="_blank" rel="noopener noreferrer" style="color:inherit">${esc(x.label)}</a><small>${esc(x.src)} · ${fmt(x.ts)} · « ${esc(x.ent)} »</small></div></div>`).join(''):'')+`</div>`);
}
function exportCSV(){
  const c=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=S.items.map(a=>[a.title,a.src,a.z,a.sev,a.rel,fmt(a.ts),a.link]);
  const blob=new Blob(['\ufeffTitre;Source;Zone;Sévérité;Fiabilité;Date;Lien\n'+rows.map(r=>r.map(c).join(';')).join('\n')],{type:'text/csv;charset=utf-8'});
  const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='veille-cyber-'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),1000);
}

/* ---- Recherche d'indicateurs (IOC) : 100 % navigateur, aucun appel réseau ---- */
function iocParse(raw){
  const v=raw.trim().replace(/hxxp/gi,'http').replace(/\[\.\]|\(\.\)|\[dot\]/gi,'.').replace(/\[:\]/g,':').replace(/\s+/g,'');
  if(/^CVE-\d{4}-\d{4,}$/i.test(v))return {t:'CVE',v:v.toUpperCase()};
  if(/^(?:[a-f0-9]{32}|[a-f0-9]{40}|[a-f0-9]{64})$/i.test(v))return {t:'Hash',v:v.toLowerCase()};
  if(/^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)$/.test(v)||(/^[0-9a-f:]{3,}$/i.test(v)&&(v.match(/:/g)||[]).length>=2))return {t:'IP',v};
  if(/^https?:\/\/[^\s/]+/i.test(v))return {t:'URL',v};
  if(/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/i.test(v))return {t:'Domaine',v:v.toLowerCase()};
  return null;
}
function iocLinks(x){
  const e=encodeURIComponent,v=x.v,vt='https://www.virustotal.com/gui/';
  return {
    IP:[['VirusTotal',vt+'ip-address/'+e(v)],['AbuseIPDB','https://www.abuseipdb.com/check/'+e(v)],['Talos','https://talosintelligence.com/reputation_center/lookup?search='+e(v)],['OTX','https://otx.alienvault.com/indicator/ip/'+e(v)],['GreyNoise','https://viz.greynoise.io/ip/'+e(v)],['Shodan','https://www.shodan.io/host/'+e(v)]],
    Domaine:[['VirusTotal',vt+'domain/'+e(v)],['urlscan','https://urlscan.io/search/#'+e('domain:'+v)],['Talos','https://talosintelligence.com/reputation_center/lookup?search='+e(v)],['OTX','https://otx.alienvault.com/indicator/domain/'+e(v)],['URLhaus','https://urlhaus.abuse.ch/browse.php?search='+e(v)],['crt.sh','https://crt.sh/?q='+e(v)]],
    URL:[['VirusTotal',vt+'search/'+e(v)],['urlscan','https://urlscan.io/search/#'+e(v)],['URLhaus','https://urlhaus.abuse.ch/browse.php?search='+e(v)]],
    Hash:[['VirusTotal',vt+'file/'+e(v)],['MalwareBazaar','https://bazaar.abuse.ch/browse.php?search='+e(v)],['Hybrid Analysis','https://www.hybrid-analysis.com/search?query='+e(v)],['OTX','https://otx.alienvault.com/indicator/file/'+e(v)]],
    CVE:[['NVD','https://nvd.nist.gov/vuln/detail/'+e(v)],['cve.org','https://www.cve.org/CVERecord?id='+e(v)],['EPSS (JSON)','https://api.first.org/data/v1/epss?cve='+e(v)]]
  }[x.t];
}
function iocShow(){
  const r=$('#iocr'),raw=$('#ioc').value;
  if(!raw.trim()){r.classList.remove('on');return}
  const x=iocParse(raw);
  r.innerHTML=x?`<div style="color:var(--m);font-size:12px">${x.t} détecté : <b style="color:var(--t)">${esc(x.v)}</b></div><div class="maps" style="margin:8px 0 6px">${iocLinks(x).map(([n,u])=>`<a class="tag" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)}</a>`).join('')}</div><div style="color:var(--m);font-size:11px">Entrée : ouvre le premier lien. Réservé aux indicateurs publics, jamais de données internes.</div>`:'<div style="color:var(--m);padding:2px 0">Indicateur non reconnu (IP, domaine, hash MD5/SHA, URL ou CVE).</div>';
  r.classList.add('on');
}

/* ---- Événements ---- */
document.addEventListener('click',e=>{
  if(!e.target.closest('#iocw'))$('#iocr').classList.remove('on');
  const b=e.target.closest('[data-a]');if(!b){if(e.target.id==='modal')closeModal();return}
  const a=b.dataset.a,fid=b.closest('[data-fid]')?.dataset.fid;
  if(a==='open'){S.read.add(b.dataset.id);saveRead();b.closest('.row').classList.add('rd');kpis();return}
  if(a==='on'||a==='ghf'||a==='wo')return;
  if(a==='ghf')return;
  e.preventDefault&&a!=='open'&&['refresh','map','out','feeds','csv','close','del','defaults','add','savebase','net'].includes(a)&&e.preventDefault();
  switch(a){
    case 'refresh':refresh();break;
    case 'ghf':S.ghf=b.checked;store.set('cv_ghf',S.ghf);panels();break;
    case 'ent':e.preventDefault();entModal();break;
    case 'entsave':{S.ent=($('#entt').value||'').slice(0,1000).trim();store.set('cv_ent',S.ent);closeModal();render();break}
    case 'page':setPage(b.dataset.p);break;
    case 'zgrp':{e.preventDefault();const k=b.dataset.k;S.zopen.has(k)?S.zopen.delete(k):S.zopen.add(k);zdRender();break}
    case 'readall':(S.pg==='zd'?S.zd:S.items).forEach(a=>S.read.add(a.id));saveRead();render();break;
    case 'cfgexp':exportCfg();break;
    case 'cfgimp':$('#cfgf').click();break;
    case 'feeds':feedsModal();break;case 'csv':exportCSV();break;case 'net':netTest();break;
    case 'savebase':{let u=$('#bu').value.trim();if(!/^https:\/\//.test(u))return;if(!u.endsWith('/'))u+='/';S.base=u;store.set('cv_base',u);closeModal();refresh();break}case 'close':closeModal();break;
    case 'del':S.feeds=S.feeds.filter(f=>f.id!==fid);saveFeeds();if(DEF.some(d=>d.id===fid))store.set('cv_del',[...new Set([...store.get('cv_del',[]),fid])]);feedsModal();render();break;
    case 'defaults':S.feeds=DEF.slice();store.set('cv_del',[]);saveFeeds();feedsModal();refresh();break;
    case 'add':{const name=$('#nn').value.trim(),url=$('#nu').value.trim();if(!name||!/^https?:\/\//i.test(url))return;S.feeds.push({id:'u'+Date.now(),name,url,cat:'Actu Cyber',lang:$('#nl').value});saveFeeds();feedsModal();refresh()}
  }
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-a]');
  if(b&&b.dataset.a==='on'){const f=S.feeds.find(x=>x.id===b.closest('[data-fid]').dataset.fid);f.on=b.checked;saveFeeds();refresh()}
  else if(b&&b.dataset.a==='ghf'){S.ghf=b.checked;store.set('cv_ghf',S.ghf);panels()}
  else if(b&&b.dataset.a==='wo'||e.target.id==='fw'){S.wo=e.target.checked;store.set('cv_wo',S.wo);panels()}
  else if(['zz','zw','zh','zg'].includes(e.target.id)){S.zf[{zz:'zero',zw:'wo',zh:'hi',zg:'grp'}[e.target.id]]=e.target.checked;store.set('cv_zf',S.zf);zdRender()}
  else if(e.target.id==='cfgf'){importCfg(e.target.files[0]);e.target.value=''}
  else if(e.target.id==='fs'){S.fsrc=e.target.value;renderFeed()}
  else if(e.target.id==='fz'||e.target.id==='fu')renderFeed()
  else if(e.target.id==='watch'){S.watch=e.target.value;store.set('cv_watch',S.watch);render()}
});
document.addEventListener('input',e=>{if(e.target.id==='fq')renderFeed();else if(e.target.id==='ioc')iocShow();else if(e.target.id==='zq'){S.zf.q=e.target.value.toLowerCase();zdRender()}});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ioc'){if(e.key==='Enter'){const x=iocParse(e.target.value);if(x)window.open(iocLinks(x)[0][1],'_blank','noopener,noreferrer')}else if(e.key==='Escape'){e.target.value='';iocShow();e.target.blur()}return}
  if(e.key==='Escape')closeModal();
  else if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#ioc').focus()}
});
setInterval(()=>{if(!S.loading&&--S.timer<=0)refresh();tick()},1000);
zdInit();setPage(S.pg);render();tick();refresh();
</script>
